[package]
name = "tpt-geometry"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CAD and mesh processing for TPT BioCAD"

[dependencies]
tpt-core = { path = "../core" }
nalgebra = "0.33"
thiserror = "2.0"
byteorder = "1.5"
zip = { version = "0.6", default-features = false }

# For STL import/export
# opencascade-rs is gated behind the "brep" feature flag to keep the default
# build lightweight. Enable with: cargo build --features brep
opencascade-sys = { version = "0.1", optional = true }
opencascade = { version = "0.1", optional = true }

[features]
default = []
brep = ["opencascade-sys", "opencascade"]
